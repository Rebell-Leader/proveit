[project]
name = "proveit"
version = "0.1.0"
description = "Checks AI-generated bug reports against the real code before a maintainer spends an hour on them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "openai>=1.80",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
proveit = "proveit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proveit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
