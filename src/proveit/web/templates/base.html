<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProveIt · Does the code agree?{% endblock %}</title>
  <meta name="description" content="Check security bug reports against the source code. See which claims hold up, follow the evidence, and decide where to investigate.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;600;650;750&family=JetBrains+Mono:wght@400;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1b18'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='%23f8f7f4' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="{{ u('/') }}"><span class="brand-mark">✓</span>ProveIt</a>
      <nav class="nav">
        <a href="{{ u('/') }}" class="{{ 'active' if request.url.path == '/' }}">Overview</a>
        <a href="{{ u('/live') }}" class="{{ 'active' if request.url.path == '/live' }}">Check a report</a>
        <a href="{{ u('/results') }}" class="{{ 'active' if request.url.path == '/results' }}">Results</a>
        <a class="gh" href="https://github.com/Rebell-Leader/proveit">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="wrap">
      <span>Built with NVIDIA Nemotron on Nebius Token Factory.</span>
      <span>Evidence for maintainers. The final call is yours.</span>
    </div>
  </footer>
  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
